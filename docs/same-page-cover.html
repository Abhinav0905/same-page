<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:1200px;height:1200px;overflow:hidden}
    body{position:relative;background:#f5ead8 url("../assets/cover/same-page-background.png") center/cover no-repeat;color:#fffaf1;font-family:Arial,sans-serif}
    .top{position:absolute;inset:0 0 auto 0;height:300px;padding:50px 66px;background:linear-gradient(180deg,rgba(32,32,29,.98),rgba(32,32,29,.94) 72%,rgba(32,32,29,0));}
    .mark{display:flex;align-items:center;gap:16px;font-size:18px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#ef9c88}
    .mark i{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:#b84c3b;color:white;font-size:26px;font-style:normal}
    h1{margin:19px 0 0;font-family:Georgia,serif;font-size:80px;line-height:.92;font-weight:500;letter-spacing:-.055em}
    .tag{position:absolute;top:218px;left:70px;font-size:27px;font-weight:600;letter-spacing:.01em;color:#e8ddd0}
    .badge{position:absolute;right:55px;bottom:44px;padding:12px 18px;border-radius:999px;background:rgba(32,32,29,.86);color:#fffaf1;font-size:17px;font-weight:700;box-shadow:0 8px 22px rgba(0,0,0,.18)}
  </style>
</head>
<body>
  <div class="top">
    <div class="mark"><i>=</i> conversation clarity</div>
    <h1>Same Page</h1>
    <div class="tag">Two memories. One clear plan.</div>
  </div>
  <div class="badge">COMPARE • CHECK • CONFIRM</div>
</body>
</html>
